openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Public product catalogue
  - name: admin
    description: Administrator-only store operations
  - name: checkout
    description: Server-verified checkout operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: getProducts
      tags: [catalog]
      summary: Browse published fragrances
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: audience
          in: query
          schema: { type: string }
        - name: brand
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price-asc, price-desc, name]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
      responses:
        "200":
          description: Product page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a published fragrance
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get store overview metrics
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Authentication or admin permission required
  /admin/products:
    get:
      operationId: getAdminProducts
      tags: [admin]
      summary: List all products for administration
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          description: Authentication or admin permission required
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a fragrance and its variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product data
        "401":
          description: Authentication or admin permission required
  /admin/products/{id}:
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a fragrance
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Authentication or admin permission required
        "404":
          description: Product not found
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Delete a fragrance and its sizes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Product deleted
        "401":
          description: Authentication or admin permission required
        "404":
          description: Product not found
  /admin/inventory/adjustments:
    post:
      operationId: adjustInventory
      tags: [admin]
      summary: Adjust variant stock with an audit reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryAdjustmentInput"
      responses:
        "200":
          description: Inventory updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAdjustment"
        "400":
          description: Invalid adjustment
        "401":
          description: Authentication or admin permission required
  /admin/orders:
    get:
      operationId: getAdminOrders
      tags: [admin]
      summary: List recent orders
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Authentication or admin permission required
  /checkout/paypal/order:
    post:
      operationId: createPayPalOrder
      tags: [checkout]
      summary: Create a pending order and PayPal order from trusted prices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: PayPal approval information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayPalOrder"
        "400":
          description: Invalid cart or unavailable stock
        "503":
          description: PayPal is not configured
  /checkout/paypal/capture:
    post:
      operationId: capturePayPalOrder
      tags: [checkout]
      summary: Capture and verify an approved PayPal order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayPalCaptureInput"
      responses:
        "200":
          description: Verified order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Capture does not match the pending order
        "503":
          description: PayPal is not configured
  /checkout/paypal/cancel:
    post:
      operationId: cancelPayPalOrder
      tags: [checkout]
      summary: Cancel a pending PayPal order and release reserved stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayPalCancelInput"
      responses:
        "200":
          description: Pending order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Pending order not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProductVariant:
      type: object
      required: [id, size, sku, priceMinor, stock]
      properties:
        id: { type: integer }
        size: { type: string }
        sku: { type: string }
        priceMinor: { type: integer, minimum: 0 }
        compareAtPriceMinor: { type: ["integer", "null"] }
        costMinor: { type: ["integer", "null"] }
        stock: { type: integer, minimum: 0 }
    Product:
      type: object
      required: [id, name, slug, brand, description, audience, scentFamily, imageUrl, status, featured, bestseller, variants, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        brand: { type: string }
        description: { type: string }
        audience: { type: string }
        concentration: { type: ["string", "null"] }
        scentFamily: { type: ["string", "null"] }
        notes: { type: array, items: { type: string } }
        imageUrl: { type: ["string", "null"] }
        status: { type: string, enum: [draft, published, archived] }
        featured: { type: boolean }
        bestseller: { type: boolean }
        variants:
          type: array
          items: { $ref: "#/components/schemas/ProductVariant" }
        createdAt: { type: string, format: date-time }
    ProductPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    VariantInput:
      type: object
      required: [size, sku, priceMinor, stock]
      properties:
        size: { type: string, minLength: 1 }
        sku: { type: string, minLength: 1 }
        priceMinor: { type: integer, minimum: 0 }
        compareAtPriceMinor: { type: ["integer", "null"] }
        costMinor: { type: ["integer", "null"] }
        stock: { type: integer, minimum: 0 }
    ProductInput:
      type: object
      required: [name, brand, description, audience, variants]
      properties:
        name: { type: string, minLength: 1 }
        brand: { type: string, minLength: 1 }
        description: { type: string }
        audience: { type: string }
        concentration: { type: ["string", "null"] }
        scentFamily: { type: ["string", "null"] }
        notes: { type: array, items: { type: string } }
        imageUrl: { type: ["string", "null"], format: uri }
        status: { type: string, enum: [draft, published, archived], default: draft }
        featured: { type: boolean, default: false }
        bestseller: { type: boolean, default: false }
        variants:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/VariantInput" }
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        brand: { type: string, minLength: 1 }
        description: { type: string }
        audience: { type: string }
        concentration: { type: ["string", "null"] }
        scentFamily: { type: ["string", "null"] }
        notes: { type: array, items: { type: string } }
        imageUrl: { type: ["string", "null"], format: uri }
        status: { type: string, enum: [draft, published, archived] }
        featured: { type: boolean }
        bestseller: { type: boolean }
    CheckoutLine:
      type: object
      required: [variantId, quantity]
      properties:
        variantId: { type: integer }
        quantity: { type: integer, minimum: 1, maximum: 10 }
    CheckoutInput:
      type: object
      required: [requestId, email, recipientName, address1, city, postcode, lines]
      properties:
        requestId: { type: string, format: uuid }
        email: { type: string, format: email }
        recipientName: { type: string, minLength: 1 }
        address1: { type: string, minLength: 1 }
        address2: { type: ["string", "null"] }
        city: { type: string, minLength: 1 }
        region: { type: ["string", "null"] }
        postcode: { type: string, minLength: 1 }
        discountCode: { type: ["string", "null"] }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CheckoutLine" }
    PayPalOrder:
      type: object
      required: [orderId, paypalOrderId, approvalUrl, cancelToken, currency, totalMinor]
      properties:
        orderId: { type: integer }
        paypalOrderId: { type: string }
        approvalUrl: { type: string, format: uri }
        cancelToken: { type: string }
        currency: { type: string }
        totalMinor: { type: integer }
    PayPalCaptureInput:
      type: object
      required: [orderId, paypalOrderId]
      properties:
        orderId: { type: integer }
        paypalOrderId: { type: string }
    PayPalCancelInput:
      type: object
      required: [orderId, cancelToken]
      properties:
        orderId: { type: integer }
        cancelToken: { type: string }
    Order:
      type: object
      required: [id, orderNumber, email, status, discountMinor, totalMinor, currency, createdAt]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        email: { type: string }
        status: { type: string, enum: [pending, paid, failed, cancelled, refunded] }
        discountMinor: { type: integer }
        totalMinor: { type: integer }
        currency: { type: string }
        paypalOrderId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    InventoryAdjustmentInput:
      type: object
      required: [variantId, delta, reason]
      properties:
        variantId: { type: integer }
        delta: { type: integer }
        reason: { type: string, minLength: 3 }
    InventoryAdjustment:
      type: object
      required: [variantId, previousStock, newStock]
      properties:
        variantId: { type: integer }
        previousStock: { type: integer }
        newStock: { type: integer }
    AdminDashboard:
      type: object
      required: [productCount, lowStockCount, pendingOrders, paidSalesMinor, recentOrders]
      properties:
        productCount: { type: integer }
        lowStockCount: { type: integer }
        pendingOrders: { type: integer }
        paidSalesMinor: { type: integer }
        recentOrders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
