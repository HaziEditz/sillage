services:
  - type: web
    name: sillage
    runtime: node
    buildCommand: corepack pnpm@9.15.9 install --frozen-lockfile && PORT=10000 BASE_PATH=/ corepack pnpm@9.15.9 --filter @workspace/sillage-fragrance run build && corepack pnpm@9.15.9 --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSLROOTCERT
        value: /etc/secrets/ca.pem
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PAYPAL_MODE
        value: live
      - key: PAYPAL_LIVE_CLIENT_ID
        sync: false
      - key: PAYPAL_LIVE_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_CLIENT_ID
        sync: false
      - key: PAYPAL_SANDBOX_CLIENT_SECRET
        sync: false
      - key: PAYPAL_LIVE_CHECKOUT_ENABLED
        value: "true"
      - key: STORE_POLICIES_FINAL
        value: "true"
      - key: SHIPPING_FEE_MINOR
        value: "1500"
